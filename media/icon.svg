<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Single-colour glyph: VS Code renders view-container icons as a mask (only alpha counts). -->
  <defs>
    <!-- back card: everything except a gap around the front card -->
    <mask id="back" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="7" y="7.6" width="16" height="15.1" rx="3.9" fill="#000"/>
    </mask>
    <!-- front card: solid, with the diff lines cut out and the added block inverted -->
    <mask id="front" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect x="8" y="8.6" width="14" height="13.1" rx="2.6" fill="#fff"/>
      <rect x="11.76" y="10.2" width="8.7" height="1" rx=".4" fill="#000"/>
      <rect x="11.76" y="11.8" width="5.4" height="1" rx=".4" fill="#000"/>
      <rect x="8.9" y="13.6" width="12.2" height="3.8" rx="1" fill="#000"/>
      <rect x="11.2" y="14.1" width="9.3" height="1" rx=".4" fill="#fff"/>
      <rect x="11.2" y="15.7" width="6.7" height="1" rx=".4" fill="#fff"/>
      <rect x="9.7" y="18.1" width="9.6" height="1" rx=".4" fill="#000"/>
      <rect x="9.7" y="19.5" width="6.5" height="1" rx=".4" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(12 12) scale(1.2) translate(-12.95 -13.15)" fill="currentColor">
    <g mask="url(#back)">
      <rect x="4.4" y="5.1" width="12.8" height="9.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <rect x="7.6" y="6.15" width="8.7" height="1" rx=".4"/>
    </g>
    <rect x="8" y="8.6" width="14" height="13.1" mask="url(#front)"/>
  </g>
</svg>
